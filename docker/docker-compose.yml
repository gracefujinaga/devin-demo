version: '3.8'

services:
  devin-scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devin-scanner
    volumes:
      - ./scripts:/app/scripts
      - ./.devin:/app/.devin
      - ./scan-results:/app/scan-results
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./pr_tracking:/app/pr_tracking
      # Mount your Superset code here for scanning
      - /Users/gracefujinaga/superset:/app/superset
    env_file:
      - .env
    environment:
      - SUPRESET_PATH=/app/superset
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: python scripts/run_simple_scan.py
